<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huspy Stock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs@3/dist/cdn.min.js" defer></script>
  <script>
    tailwind.config = {
      theme: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        extend: { colors: {
          brand: '#1e40af',
          'brand-light': '#eff6ff',
          up: '#059669', 'up-bg': '#ecfdf5',
          down: '#dc2626', 'down-bg': '#fef2f2',
          muted: '#6b7280',
        }}
      }
    }
  </script>
  <style>
    * { font-feature-settings: 'tnum' on, 'lnum' on; }
    body { background: #f8fafc; }
    [x-cloak] { display: none !important; }
    .bar { transition: width 0.4s ease; }
  </style>
</head>
<body class="font-sans text-gray-900 min-h-screen" x-data="dashboard()" x-init="load()">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 class="text-lg font-bold text-brand">Huspy Stock</h1>
        <span x-show="data" x-text="data?.latestDate" class="text-sm text-muted bg-gray-100 px-2 py-0.5 rounded"></span>
      </div>
      <div class="flex items-center gap-2">
        <button @click="tab='overview'" :class="tab==='overview' ? 'bg-brand text-white' : 'text-gray-600 hover:bg-gray-100'" class="px-3 py-1.5 rounded-md text-sm font-medium transition">Overview</button>
        <button @click="tab='new'" :class="tab==='new' ? 'bg-brand text-white' : 'text-gray-600 hover:bg-gray-100'" class="px-3 py-1.5 rounded-md text-sm font-medium transition">
          New 📝 <span x-show="data" x-text="data?.newTotal" class="ml-1 text-xs bg-white/20 px-1.5 py-0.5 rounded"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Loading -->
  <div x-show="loading" class="flex items-center justify-center py-20">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand"></div>
  </div>

  <main x-show="data" x-cloak class="max-w-6xl mx-auto px-4 py-6">

    <!-- ============ OVERVIEW TAB ============ -->
    <div x-show="tab==='overview'">
      <!-- Top cards -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <div class="bg-white rounded-lg border border-gray-200 p-4">
          <div class="text-sm text-muted mb-1">Total Listings</div>
          <div class="text-2xl font-bold" x-text="fmt(data?.total)"></div>
        </div>
        <div class="bg-white rounded-lg border border-gray-200 p-4">
          <div class="text-sm text-muted mb-1">For Sale</div>
          <div class="text-2xl font-bold" x-text="fmt(data?.sale)"></div>
        </div>
        <div class="bg-white rounded-lg border border-gray-200 p-4">
          <div class="text-sm text-muted mb-1">For Rent</div>
          <div class="text-2xl font-bold" x-text="fmt(data?.rent)"></div>
        </div>
        <div class="bg-white rounded-lg border border-gray-200 p-4 border-l-4 border-l-brand">
          <div class="text-sm text-muted mb-1">📝 New Listings</div>
          <div class="text-2xl font-bold text-brand" x-text="fmt(data?.newTotal)"></div>
          <div class="text-xs text-muted mt-1">vs <span x-text="data?.prevDate"></span></div>
        </div>
      </div>

      <!-- New by Area (top 15) -->
      <div class="bg-white rounded-lg border border-gray-200 p-4 mb-4">
        <h2 class="font-semibold mb-3">New Listings by Area</h2>
        <div class="space-y-1.5">
          <template x-for="[area, count] in (data?.byArea || []).slice(0, 15)" :key="area">
            <div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 rounded px-2 py-1 -mx-2" @click="drillArea(area)">
              <div class="w-40 md:w-56 text-sm truncate" x-text="area"></div>
              <div class="flex-1 bg-gray-100 rounded-full h-5 overflow-hidden">
                <div class="bg-brand/70 h-full rounded-full bar" :style="'width:' + (count / maxArea * 100) + '%'"></div>
              </div>
              <div class="w-8 text-right text-sm font-medium" x-text="count"></div>
            </div>
          </template>
        </div>
        <button x-show="(data?.byArea||[]).length > 15" @click="showAllAreas = !showAllAreas" class="text-sm text-brand mt-2 hover:underline" x-text="showAllAreas ? 'Show less' : 'Show all ' + data?.byArea?.length + ' areas'"></button>
        <div x-show="showAllAreas" class="space-y-1.5 mt-2">
          <template x-for="[area, count] in (data?.byArea || []).slice(15)" :key="area">
            <div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 rounded px-2 py-1 -mx-2" @click="drillArea(area)">
              <div class="w-40 md:w-56 text-sm truncate" x-text="area"></div>
              <div class="flex-1 bg-gray-100 rounded-full h-5 overflow-hidden">
                <div class="bg-brand/70 h-full rounded-full bar" :style="'width:' + (count / maxArea * 100) + '%'"></div>
              </div>
              <div class="w-8 text-right text-sm font-medium" x-text="count"></div>
            </div>
          </template>
        </div>
      </div>

      <!-- Price + Agent side by side -->
      <div class="grid md:grid-cols-2 gap-4">
        <!-- By Price -->
        <div class="bg-white rounded-lg border border-gray-200 p-4">
          <h2 class="font-semibold mb-3">New by Price (Sale)</h2>
          <div class="space-y-2">
            <template x-for="band in saleBandOrder" :key="band">
              <div x-show="data?.salePriceBands?.[band]" class="flex items-center gap-3">
                <div class="w-24 text-sm text-muted" x-text="band"></div>
                <div class="flex-1 bg-gray-100 rounded-full h-5 overflow-hidden">
                  <div class="bg-emerald-500/70 h-full rounded-full bar" :style="'width:' + ((data?.salePriceBands?.[band]||0) / maxSalePrice * 100) + '%'"></div>
                </div>
                <div class="w-8 text-right text-sm font-medium" x-text="data?.salePriceBands?.[band]||0"></div>
              </div>
            </template>
          </div>
          <h2 class="font-semibold mb-3 mt-5">New by Price (Rent)</h2>
          <div class="space-y-2">
            <template x-for="band in rentBandOrder" :key="band">
              <div x-show="data?.rentPriceBands?.[band]" class="flex items-center gap-3">
                <div class="w-24 text-sm text-muted" x-text="band"></div>
                <div class="flex-1 bg-gray-100 rounded-full h-5 overflow-hidden">
                  <div class="bg-blue-500/70 h-full rounded-full bar" :style="'width:' + ((data?.rentPriceBands?.[band]||0) / maxRentPrice * 100) + '%'"></div>
                </div>
                <div class="w-8 text-right text-sm font-medium" x-text="data?.rentPriceBands?.[band]||0"></div>
              </div>
            </template>
          </div>
        </div>

        <!-- By Agent Level -->
        <div class="bg-white rounded-lg border border-gray-200 p-4">
          <h2 class="font-semibold mb-3">New by Agent Level</h2>
          <div class="space-y-2">
            <template x-for="level in agentLevels" :key="level">
              <div x-show="data?.byAgentLevel?.[level]" class="flex items-center gap-3">
                <div class="w-24 text-sm text-muted flex items-center gap-1.5">
                  <span x-text="agentBadge(level)" class="text-xs"></span>
                  <span x-text="level"></span>
                </div>
                <div class="flex-1 bg-gray-100 rounded-full h-5 overflow-hidden">
                  <div class="h-full rounded-full bar" :class="agentColor(level)" :style="'width:' + ((data?.byAgentLevel?.[level]||0) / maxAgent * 100) + '%'"></div>
                </div>
                <div class="w-8 text-right text-sm font-medium" x-text="data?.byAgentLevel?.[level]||0"></div>
              </div>
            </template>
          </div>
          <!-- Pie-style summary -->
          <div class="mt-4 flex flex-wrap gap-2">
            <template x-for="level in agentLevels" :key="'tag-'+level">
              <span x-show="data?.byAgentLevel?.[level]" class="inline-flex items-center gap-1 text-xs px-2 py-1 rounded-full bg-gray-100">
                <span x-text="agentBadge(level)"></span>
                <span x-text="level"></span>
                <span class="font-semibold" x-text="pct(data?.byAgentLevel?.[level], data?.newTotal)"></span>
              </span>
            </template>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ NEW LISTINGS TAB ============ -->
    <div x-show="tab==='new'">
      <!-- Filters -->
      <div class="flex flex-wrap gap-2 mb-4">
        <select x-model="filterPurpose" class="text-sm border border-gray-300 rounded-md px-2 py-1.5">
          <option value="">All Types</option>
          <option value="sale">Sale</option>
          <option value="rent">Rent</option>
        </select>
        <select x-model="filterArea" class="text-sm border border-gray-300 rounded-md px-2 py-1.5">
          <option value="">All Areas</option>
          <template x-for="[area] in data?.byArea||[]" :key="'f-'+area">
            <option :value="area" x-text="area"></option>
          </template>
        </select>
        <select x-model="filterAgent" class="text-sm border border-gray-300 rounded-md px-2 py-1.5">
          <option value="">All Agent Levels</option>
          <template x-for="level in agentLevels" :key="'fa-'+level">
            <option :value="level" x-text="level"></option>
          </template>
        </select>
        <span class="text-sm text-muted self-center ml-auto" x-text="filtered().length + ' listings'"></span>
      </div>

      <!-- Listings table -->
      <div class="bg-white rounded-lg border border-gray-200 overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-left text-muted">
            <tr>
              <th class="px-3 py-2 font-medium">Community</th>
              <th class="px-3 py-2 font-medium">Type</th>
              <th class="px-3 py-2 font-medium">Beds</th>
              <th class="px-3 py-2 font-medium">Price</th>
              <th class="px-3 py-2 font-medium">Purpose</th>
              <th class="px-3 py-2 font-medium">Agent</th>
              <th class="px-3 py-2 font-medium">Level</th>
              <th class="px-3 py-2 font-medium"></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            <template x-for="l in filtered().slice(0, listLimit)" :key="l.id">
              <tr class="hover:bg-gray-50">
                <td class="px-3 py-2 font-medium" x-text="l.community"></td>
                <td class="px-3 py-2" x-text="l.type"></td>
                <td class="px-3 py-2" x-text="l.bedrooms ?? '—'"></td>
                <td class="px-3 py-2" x-text="l.priceFormatted"></td>
                <td class="px-3 py-2">
                  <span class="px-1.5 py-0.5 rounded text-xs font-medium" :class="l.purpose==='sale' ? 'bg-emerald-50 text-emerald-700' : 'bg-blue-50 text-blue-700'" x-text="l.purpose"></span>
                </td>
                <td class="px-3 py-2 text-muted" x-text="l.agent || '—'"></td>
                <td class="px-3 py-2">
                  <span class="text-xs" x-text="agentBadge(l.agentLevel) + ' ' + l.agentLevel"></span>
                </td>
                <td class="px-3 py-2">
                  <a :href="'https://www.bayut.com' + l.url" target="_blank" class="text-brand hover:underline text-xs">View →</a>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        <div x-show="filtered().length > listLimit" class="p-3 text-center border-t border-gray-100">
          <button @click="listLimit += 50" class="text-sm text-brand hover:underline">Load more</button>
        </div>
        <div x-show="filtered().length === 0" class="p-8 text-center text-muted">No new listings match filters</div>
      </div>
    </div>

    <!-- ============ AREA DRILL-DOWN MODAL ============ -->
    <div x-show="drillAreaName" x-cloak class="fixed inset-0 bg-black/30 z-50 flex items-start justify-center pt-20" @click.self="drillAreaName=null">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[70vh] overflow-y-auto">
        <div class="sticky top-0 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
          <h3 class="font-semibold" x-text="'📝 New in ' + drillAreaName"></h3>
          <button @click="drillAreaName=null" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
        </div>
        <div class="p-4">
          <template x-for="l in areaListings()" :key="l.id">
            <div class="flex items-center justify-between py-2 border-b border-gray-50 last:border-0">
              <div>
                <div class="font-medium text-sm" x-text="l.type + (l.bedrooms ? ' · ' + l.bedrooms + ' bed' : '')"></div>
                <div class="text-xs text-muted" x-text="l.sub_community || l.community"></div>
              </div>
              <div class="text-right">
                <div class="text-sm font-medium" x-text="l.priceFormatted"></div>
                <div class="flex items-center gap-2">
                  <span class="text-xs px-1.5 py-0.5 rounded" :class="l.purpose==='sale' ? 'bg-emerald-50 text-emerald-700' : 'bg-blue-50 text-blue-700'" x-text="l.purpose"></span>
                  <a :href="'https://www.bayut.com' + l.url" target="_blank" class="text-brand text-xs hover:underline">View →</a>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

  </main>

  <script>
    function dashboard() {
      return {
        data: null,
        loading: true,
        tab: 'overview',
        showAllAreas: false,
        filterPurpose: '',
        filterArea: '',
        filterAgent: '',
        listLimit: 50,
        drillAreaName: null,

        saleBandOrder: ['Under 1M', '1M–2M', '2M–5M', '5M–10M', '10M+'],
        rentBandOrder: ['Under 50K', '50K–100K', '100K–200K', '200K–350K', '350K+'],
        agentLevels: ['Signature', 'Hot', 'TruBroker', 'Verified', 'Standard'],

        get maxArea() { return Math.max(...(this.data?.byArea||[[,1]]).map(a => a[1])); },
        get maxSalePrice() { return Math.max(...Object.values(this.data?.salePriceBands||{1:1}), 1); },
        get maxRentPrice() { return Math.max(...Object.values(this.data?.rentPriceBands||{1:1}), 1); },
        get maxAgent() { return Math.max(...Object.values(this.data?.byAgentLevel||{1:1}), 1); },

        fmt(n) { return n?.toLocaleString() ?? '—'; },
        pct(n, total) { return total ? Math.round(n / total * 100) + '%' : ''; },

        agentBadge(level) {
          return { Signature: '⭐', Hot: '🔥', TruBroker: '✅', Verified: '☑️', Standard: '◽' }[level] || '';
        },
        agentColor(level) {
          return { Signature: 'bg-amber-500/70', Hot: 'bg-orange-500/70', TruBroker: 'bg-green-500/70', Verified: 'bg-blue-400/70', Standard: 'bg-gray-400/70' }[level] || 'bg-gray-400/70';
        },

        filtered() {
          return (this.data?.newListings || []).filter(l => {
            if (this.filterPurpose && l.purpose !== this.filterPurpose) return false;
            if (this.filterArea && l.community !== this.filterArea) return false;
            if (this.filterAgent && l.agentLevel !== this.filterAgent) return false;
            return true;
          });
        },

        drillArea(area) { this.drillAreaName = area; },
        areaListings() {
          return (this.data?.newListings || []).filter(l => l.community === this.drillAreaName);
        },
