<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huspy · Dubai Market Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs@3/dist/cdn.min.js" defer></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#0a0a0f',
            card: '#12121a',
            border: '#1e1e2e',
            accent: '#6366f1',
            'accent-2': '#22d3ee',
            muted: '#71717a',
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0a0a0f; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    [x-cloak] { display: none !important; }
    .bar-animate { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>
<body class="text-zinc-100 min-h-screen" x-data="dashboard()" x-init="init()">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-bg/90 backdrop-blur border-b border-border">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-accent flex items-center justify-center text-white font-bold text-sm">H</div>
        <div>
          <div class="text-sm font-semibold">Huspy Market Intel</div>
          <div class="text-[10px] text-muted uppercase tracking-widest">Dubai · Live</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <!-- Mode toggle -->
        <div class="flex rounded-lg border border-border bg-card p-0.5 text-xs">
          <button @click="mode='sale'" :class="mode==='sale' ? 'bg-accent text-white' : 'text-muted hover:text-white'" class="px-3 py-1.5 rounded-md transition-all font-medium">Sale</button>
          <button @click="mode='rent'" :class="mode==='rent' ? 'bg-accent text-white' : 'text-muted hover:text-white'" class="px-3 py-1.5 rounded-md transition-all font-medium">Rent</button>
        </div>
        <!-- View toggle -->
        <div class="flex rounded-lg border border-border bg-card p-0.5 text-xs">
          <button @click="view='overview'" :class="view==='overview' ? 'bg-zinc-700 text-white' : 'text-muted hover:text-white'" class="px-3 py-1.5 rounded-md transition-all">Overview</button>
          <button @click="view='communities'" :class="view==='communities' ? 'bg-zinc-700 text-white' : 'text-muted hover:text-white'" class="px-3 py-1.5 rounded-md transition-all">Communities</button>
          <button @click="view='agents'" :class="view==='agents' ? 'bg-zinc-700 text-white' : 'text-muted hover:text-white'" class="px-3 py-1.5 rounded-md transition-all">Agents</button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">

    <!-- Loading -->
    <div x-show="loading" class="text-center py-20 text-muted text-sm">Loading snapshot data…</div>

    <!-- Overview -->
    <template x-if="!loading && view==='overview'">
      <div class="space-y-6">
        <!-- Snapshot info -->
        <div class="flex items-end justify-between">
          <div>
            <h1 class="text-2xl font-bold tracking-tight">Market Overview</h1>
            <p class="text-xs text-muted mt-1" x-text="'Snapshot ' + (latest?.snapshot_date || '—') + (previous ? ' · vs ' + previous.snapshot_date : '')"></p>
          </div>
        </div>

        <!-- Market Share Cards -->
        <div class="grid grid-cols-2 gap-4">
          <div class="rounded-xl border border-border bg-card p-5">
            <div class="text-[10px] uppercase tracking-widest text-muted mb-2">Sale Market Share</div>
            <div class="text-3xl font-bold tabular-nums" x-text="marketShare('sale')"></div>
            <div class="text-xs text-muted mt-1" x-text="marketShareSub('sale')"></div>
          </div>
          <div class="rounded-xl border border-border bg-card p-5">
            <div class="text-[10px] uppercase tracking-widest text-muted mb-2">Rent Market Share</div>
            <div class="text-3xl font-bold tabular-nums" x-text="marketShare('rent')"></div>
            <div class="text-xs text-muted mt-1" x-text="marketShareSub('rent')"></div>
          </div>
        </div>

        <!-- KPI Row -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="rounded-xl border border-border bg-card p-4">
            <div class="text-[10px] uppercase tracking-widest text-muted">Huspy Listings</div>
            <div class="text-2xl font-bold mt-1 tabular-nums" x-text="fmt(block()?.total)"></div>
            <div class="text-xs text-muted mt-1" x-text="prevBlock() ? 'prev ' + fmt(prevBlock()?.total) : ''"></div>
          </div>
          <div class="rounded-xl border border-border bg-card p-4">
            <div class="text-[10px] uppercase tracking-widest text-muted">Communities</div>
            <div class="text-2xl font-bold mt-1 tabular-nums" x-text="Object.keys(block()?.by_community || {}).length"></div>
          </div>
          <div class="rounded-xl border border-border bg-card p-4">
            <div class="text-[10px] uppercase tracking-widest text-muted">Top Share</div>
            <div class="text-2xl font-bold mt-1 tabular-nums" x-text="topShare()?.pct || '—'"></div>
            <div class="text-xs text-muted mt-1 truncate" x-text="topShare()?.name || ''"></div>
          </div>
          <div class="rounded-xl border border-border bg-card p-4">
            <div class="text-[10px] uppercase tracking-widest text-muted">Snapshot</div>
            <div class="text-lg font-bold mt-1" x-text="latest?.snapshot_date || '—'"></div>
          </div>
        </div>

        <!-- Property Type Bar -->
        <div class="rounded-xl border border-border bg-card p-5">
          <div class="text-xs font-semibold mb-3">Property Types — <span x-text="mode"></span></div>
          <div class="flex rounded-full overflow-hidden h-4 mb-3">
            <template x-for="(t, i) in typeData()" :key="t.name">
              <div :class="typeColors[i % typeColors.length]" :style="'width:' + t.pct + '%'" class="bar-animate" :title="t.name + ': ' + t.count"></div>
            </template>
          </div>
          <div class="flex flex-wrap gap-x-5 gap-y-1.5">
            <template x-for="(t, i) in typeData()" :key="t.name">
              <div class="flex items-center gap-1.5 text-xs">
                <div :class="typeColors[i % typeColors.length]" class="w-3 h-3 rounded"></div>
                <span x-text="t.name" class="font-medium"></span>
                <span class="text-muted tabular-nums" x-text="fmt(t.count) + ' (' + t.pct.toFixed(1) + '%)'"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Movers -->
        <div class="grid md:grid-cols-2 gap-4">
          <div class="rounded-xl border border-border bg-card overflow-hidden">
            <div class="px-4 py-3 border-b border-border text-xs font-semibold flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Top Gainers
            </div>
            <template x-for="r in movers().up" :key="r.name">
              <div class="flex items-center justify-between px-4 py-2.5 border-b border-border/50 last:border-0">
                <span class="text-xs truncate" x-text="r.name"></span>
                <span class="text-xs text-emerald-400 tabular-nums font-medium" x-text="'+' + r.delta.toFixed(2) + 'pp'"></span>
              </div>
            </template>
          </div>
          <div class="rounded-xl border border-border bg-card overflow-hidden">
            <div class="px-4 py-3 border-b border-border text-xs font-semibold flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-red-500"></span> Top Decliners
            </div>
            <template x-for="r in movers().down" :key="r.name">
              <div class="flex items-center justify-between px-4 py-2.5 border-b border-border/50 last:border-0">
                <span class="text-xs truncate" x-text="r.name"></span>
                <span class="text-xs text-red-400 tabular-nums font-medium" x-text="r.delta.toFixed(2) + 'pp'"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Community Table -->
        <div class="rounded-xl border border-border bg-card overflow-hidden">
          <div class="px-4 py-3 border-b border-border text-xs font-semibold">
            Communities — <span x-text="mode"></span> market share
          </div>
          <div class="overflow-x-auto scrollbar-hide">
            <table class="w-full text-xs">
              <thead class="text-muted bg-zinc-900/50">
                <tr>
                  <th class="text-left px-4 py-2.5 font-medium">Community</th>
                  <th class="text-left px-3 py-2.5 font-medium">Types</th>
                  <th class="text-right px-3 py-2.5 font-medium">Huspy</th>
                  <th class="text-right px-3 py-2.5 font-medium">Market</th>
                  <th class="text-right px-3 py-2.5 font-medium">Share</th>
                  <th class="text-right px-4 py-2.5 font-medium">Δ vs prev</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="r in commRows()" :key="r.name">
                  <tr class="border-t border-border/50 hover:bg-zinc-800/30 cursor-pointer" @click="selectCommunity(r.name)">
                    <td class="px-4 py-2 font-medium">
                      <span class="hover:text-accent transition-colors" x-text="r.name"></span>
                    </td>
                    <td class="px-3 py-2">
                      <div class="flex gap-1">
                        <template x-for="t in r.topTypes" :key="t.name">
                          <span class="inline-flex items-center rounded bg-zinc-800 px-1.5 py-0.5 text-[10px] text-zinc-400">
                            <span x-text="t.abbr + ':' + t.count"></span>
                          </span>
                        </template>
                      </div>
                    </td>
                    <td class="px-3 py-2 text-right tabular-nums" x-text="fmt(r.count)"></td>
                    <td class="px-3 py-2 text-right tabular-nums text-muted" x-text="r.market != null ? fmt(r.market) : '—'"></td>
                    <td class="px-3 py-2 text-right tabular-nums font-medium" x-text="r.share != null ? r.share.toFixed(2) + '%' : '—'"></td>
                    <td class="px-4 py-2 text-right tabular-nums">
                      <span :class="r.delta > 0 ? 'text-emerald-400' : r.delta < 0 ? 'text-red-400' : 'text-muted'"
                            x-text="r.delta != null ? (r.delta > 0 ? '+' : '') + r.delta.toFixed(2) + 'pp' : '—'"></span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </template>

    <!-- Community Detail -->
    <template x-if="!loading && view==='community-detail'">
      <div class="space-y-6">
        <div>
          <button @click="view='overview'" class="text-xs text-muted hover:text-white transition-colors mb-2">← Back to overview</button>
          <h1 class="text-2xl font-bold" x-text="selectedCommunity"></h1>
          <p class="text-xs text-muted mt-1" x-text="'Snapshot ' + (latest?.snapshot_date || '') + ' · ' + mode"></p>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
          <template x-for="s in commDetailStats()" :key="s.label">
            <div class="rounded-xl border border-border bg-card p-4">
              <div class="text-[10px] uppercase tracking-widest text-muted" x-text="s.label"></div>
              <div class="text-xl font-bold mt-1 tabular-nums" x-text="s.value"></div>
            </div>
          </template>
        </div>

        <!-- Property Types -->
        <div class="rounded-xl border border-border bg-card p-5" x-show="commDetailTypes().length > 0">
          <div class="text-xs font-semibold mb-3">Property Types</div>
          <div class="flex rounded-full overflow-hidden h-3 mb-3">
            <template x-for="(t, i) in commDetailTypes()" :key="t.name">
              <div :class="typeColors[i % typeColors.length]" :style="'width:' + t.pct + '%'" class="bar-animate"></div>
            </template>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
            <template x-for="(t, i) in commDetailTypes()" :key="t.name">
              <div class="flex items-center gap-1.5 text-xs">
                <div :class="typeColors[i % typeColors.length]" class="w-2.5 h-2.5 rounded"></div>
                <span x-text="t.name" class="font-medium"></span>
                <span class="text-muted" x-text="t.count + ' (S:' + t.sale + ' R:' + t.rent + ')'"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Bedrooms -->
        <div class="rounded-xl border border-border bg-card p-5" x-show="Object.keys(commNode()?.beds || {}).length > 0">
          <div class="text-xs font-semibold mb-3">Bedrooms</div>
          <div class="space-y-2">
            <template x-for="b in commDetailBeds()" :key="b.label">
              <div class="flex items-center gap-3 text-xs">
                <span class="w-14 text-right text-muted" x-text="b.label"></span>
                <div class="flex-1 bg-zinc-800 rounded-full h-2.5 overflow-hidden">
                  <div class="bg-accent h-full rounded-full bar-animate" :style="'width:' + b.pct + '%'"></div>
                </div>
                <span class="w-8 text-right tabular-nums font-medium" x-text="b.count"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Price Distribution -->
        <div class="rounded-xl border border-border bg-card p-5" x-show="Object.keys(commNode()?.price_bands || {}).length > 0">
          <div class="text-xs font-semibold mb-3">Price Distribution</div>
          <div class="space-y-2">
            <template x-for="b in commDetailBands()" :key="b.label">
              <div class="flex items-center gap-3 text-xs">
                <span class="w-20 text-right text-muted" x-text="b.label"></span>
                <div class="flex-1 bg-zinc-800 rounded-full h-2.5 overflow-hidden">
                  <div class="bg-emerald-500 h-full rounded-full bar-animate" :style="'width:' + b.pct + '%'"></div>
                </div>
                <span class="w-8 text-right tabular-nums font-medium" x-text="b.count"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Sub-communities -->
        <div class="rounded-xl border border-border bg-card overflow-hidden" x-show="commDetailSubs().length > 0">
          <div class="px-4 py-3 border-b border-border text-xs font-semibold">Sub-communities</div>
          <table class="w-full text-xs">
            <thead class="text-muted bg-zinc-900/50">
              <tr>
                <th class="text-left px-4 py-2.5 font-medium">Sub-community</th>
                <th class="text-right px-3 py-2.5 font-medium">Listings</th>
                <th class="text-right px-4 py-2.5 font-medium">Avg Price</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="s in commDetailSubs()" :key="s.name">
                <tr class="border-t border-border/50">
                  <td class="px-4 py-2 font-medium" x-text="s.name"></td>
                  <td class="px-3 py-2 text-right tabular-nums" x-text="s.count"></td>
                  <td class="px-4 py-2 text-right tabular-nums text-muted" x-text="fmtAed(s.avg_price)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- Agents -->
        <div class="rounded-xl border border-border bg-card overflow-hidden" x-show="commDetailAgents().length > 0">
          <div class="px-4 py-3 border-b border-border text-xs font-semibold">Agent Leaderboard</div>
          <table class="w-full text-xs">
            <thead class="text-muted bg-zinc-900/50">
              <tr>
                <th class="text-left px-4 py-2.5 font-medium">Agent</th>
                <th class="text-right px-3 py-2.5 font-medium">Listings</th>
                <th class="text-right px-4 py-2.5 font-medium">Share</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="a in commDetailAgents()" :key="a.name">
                <tr class="border-t border-border/50">
                  <td class="px-4 py-2 font-medium" x-text="a.name"></td>
                  <td class="px-3 py-2 text-right tabular-nums" x-text="a.count"></td>
                  <td class="px-4 py-2 text-right tabular-nums text-muted" x-text="a.share_pct != null ? a.share_pct.toFixed(1) + '%' : '—'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </template>

    <!-- Communities list view -->
    <template x-if="!loading && view==='communities'">
      <div class="space-y-6">
        <h1 class="text-2xl font-bold">Communities</h1>
        <div class="rounded-xl border border-border bg-card overflow-hidden">
          <div class="overflow-x-auto scrollbar-hide">
            <table class="w-full text-xs">
              <thead class="text-muted bg-zinc-900/50">
                <tr>
                  <th class="text-left px-4 py-2.5 font-medium">Community</th>
                  <th class="text-left px-3 py-2.5 font-medium">Types</th>
                  <th class="text-right px-3 py-2.5 font-medium">Huspy</th>
                  <th class="text-right px-3 py-2.5 font-medium">Market</th>
                  <th class="text-right px-3 py-2.5 font-medium">Share</th>
                  <th class="text-right px-3 py-2.5 font-medium">Avg Price</th>
                  <th class="text-right px-4 py-2.5 font-medium">Δ pp</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="r in commRows()" :key="r.name">
                  <tr class="border-t border-border/50 hover:bg-zinc-800/30 cursor-pointer" @click="selectCommunity(r.name)">
                    <td class="px-4 py-2 font-medium hover:text-accent transition-colors" x-text="r.name"></td>
                    <td class="px-3 py-2">
                      <div class="flex gap-1">
                        <template x-for="t in r.topTypes" :key="t.name">
                          <span class="inline-flex rounded bg-zinc-800 px-1.5 py-0.5 text-[10px] text-zinc-400" x-text="t.abbr + ':' + t.count"></span>
                        </template>
                      </div>
                    </td>
                    <td class="px-3 py-2 text-right tabular-nums" x-text="fmt(r.count)"></td>
                    <td class="px-3 py-2 text-right tabular-nums text-muted" x-text="r.market != null ? fmt(r.market) : '—'"></td>
                    <td class="px-3 py-2 text-right tabular-nums font-medium" x-text="r.share != null ? r.share.toFixed(2) + '%' : '—'"></td>
                    <td class="px-3 py-2 text-right tabular-nums text-muted" x-text="fmtAed(r.avg_price)"></td>
                    <td class="px-4 py-2 text-right tabular-nums">
                      <span :class="r.delta > 0 ? 'text-emerald-400' : r.delta < 0 ? 'text-red-400' : 'text-muted'"
                            x-text="r.delta != null ? (r.delta > 0 ? '+' : '') + r.delta.toFixed(2) + 'pp' : '—'"></span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </template>

    <!-- Agents view -->
    <template x-if="!loading && view==='agents'">
      <div class="space-y-6">
        <h1 class="text-2xl font-bold">Agents</h1>
        <div class="rounded-xl border border-border bg-card overflow-hidden">
          <table class="w-full text-xs">
            <thead class="text-muted bg-zinc-900/50">
              <tr>
                <th class="text-left px-4 py-2.5 font-medium">#</th>
                <th class="text-left px-3 py-2.5 font-medium">Agent</th>
                <th class="text-right px-3 py-2.5 font-medium">Listings</th>
                <th class="text-right px-4 py-2.5 font-medium">Share</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(a, i) in agentRows()" :key="a.name">
                <tr class="border-t border-border/50">
                  <td class="px-4 py-2 text-muted" x-text="i + 1"></td>
                  <td class="px-3 py-2 font-medium" x-text="a.name"></td>
                  <td class="px-3 py-2 text-right tabular-nums" x-text="a.count"></td>
                  <td class="px-4 py-2 text-right tabular-nums text-muted" x-text="a.share.toFixed(1) + '%'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </template>

  </main>

  <footer class="max-w-7xl mx-auto px-4 sm:px-6 py-8 text-center text-[10px] text-zinc-600">
    Huspy Market Intelligence · Data refreshed daily at 06:00 GST
  </footer>

<script>
const SUPABASE_URL = 'https://qwmjjrcdkrtoitwdsfhe.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3bWpqcmNka3J0b2l0d2RzZmhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTk3MjAsImV4cCI6MjA5NDIzNTcyMH0.FFnbLvx-JPZAYBwUv8remvNrwlH-AV0j5MovWw5UUkU';

function dashboard() {
  return {
    loading: true,
    mode: 'sale',
    view: 'overview',
    latest: null,
    previous: null,
    selectedCommunity: null,
    typeColors: ['bg-blue-500','bg-emerald-500','bg-amber-500','bg-purple-500','bg-rose-500','bg-cyan-500','bg-orange-500','bg-teal-500'],
    abbrevMap: { Apartment:'Apt', Townhouse:'TH', Villa:'Villa', Office:'Off', Penthouse:'PH', Shop:'Shop', 'Commercial Floor':'Comm' },

    async init() {
      const headers = { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` };
      const res = await fetch(`${SUPABASE_URL}/rest/v1/market_intel_snapshots?select=id,snapshot_date,generated_at,data&order=snapshot_date.desc&limit=2`, { headers });
      const rows = await res.json();
      this.latest = rows[0] || null;
      this.previous = rows[1] || null;
      this.loading = false;
    },

    block() { return this.latest?.data?.[this.mode] || null; },
    prevBlock() { return this.previous?.data?.[this.mode] || null; },

    fmt(n) { return n == null ? '—' : new Intl.NumberFormat('en-US').format(n); },
    fmtAed(n) {
      if (n == null) return '—';
      if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
      if (n >= 1e3) return Math.round(n/1e3) + 'K';
      return this.fmt(n);
    },

    marketShare(m) {
      const d = this.latest?.data?.[m];
      if (!d) return '—';
      const mkt = d.dubai_market_total;
      return mkt > 0 ? ((d.total / mkt) * 100).toFixed(2) + '%' : '—';
    },
    marketShareSub(m) {
      const d = this.latest?.data?.[m];
      if (!d) return '';
      const mkt = d.dubai_market_total;
      return this.fmt(d.total) + ' / ' + this.fmt(mkt) + ' online listings';
    },

    topShare() {
      const rows = this.commRows();
      if (!rows.length) return null;
      return { name: rows[0].name, pct: rows[0].share?.toFixed(1) + '%' };
    },

    typeData() {
      const b = this.block();
      if (!b) return [];
      const totals = {};
      for (const c of Object.values(b.by_community || {})) {
        for (const [t, d] of Object.entries(c.by_type || {})) {
          totals[t] = (totals[t] || 0) + (d.total || 0);
        }
      }
      const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      const total = sorted.reduce((s, [, n]) => s + n, 0);
      return sorted.map(([name, count]) => ({ name, count, pct: total ? count / total * 100 : 0 }));
    },

    commRows() {
      const cur = this.block();
      const prev = this.prevBlock();
      if (!cur) return [];
      const prevMap = prev?.by_community || {};
      const rows = Object.entries(cur.by_community || {}).map(([name, node]) => {
        const prevNode = prevMap[name];
        const share = node.share_pct ?? null;
        const prevShare = prevNode?.share_pct ?? null;
        const bt = node.by_type || {};
        const topTypes = Object.entries(bt)
          .sort((a, b) => b[1].total - a[1].total)
          .slice(0, 2)
          .map(([t, d]) => ({ name: t, abbr: this.abbrevMap[t] || t.slice(0,3), count: d.total }));
        return {
          name, count: node.count || 0,
          market: node.market_total ?? null,
          share, avg_price: node.avg_price ?? null,
          delta: share != null && prevShare != null ? share - prevShare : null,
          topTypes,
        };
      });
      rows.sort((a, b) => (b.share ?? 0) - (a.share ?? 0));
      return rows;
    },

    movers() {
      const rows = this.commRows().filter(r => r.delta != null);
      const up = [...rows].sort((a, b) => b.delta - a.delta).slice(0, 5);
      const down = [...rows].sort((a, b) => a.delta - b.delta).slice(0, 5);
      return { up, down };
    },

    agentRows() {
      const b = this.block();
      if (!b) return [];
      const merged = {};
      for (const c of Object.values(b.by_community || {})) {
        for (const a of (c.agents || [])) {
          if (!merged[a.name]) merged[a.name] = { name: a.name, count: 0 };
          merged[a.name].count += a.count;
        }
      }
      const total = b.total || 1;
      return Object.values(merged)
        .map(a => ({ ...a, share: a.count / total * 100 }))
        .sort((a, b) => b.count - a.count);
    },

    selectCommunity(name) {
      this.selectedCommunity = name;
      this.view = 'community-detail';
    },

    commNode() {
      return this.block()?.by_community?.[this.selectedCommunity] || {};
    },

    commDetailStats() {
      const n = this.commNode();
      const stats = [
        { label: 'Huspy', value: this.fmt(n.count) },
        { label: 'Market', value: n.market_total != null ? this.fmt(n.market_total) : '—' },
        { label: 'Share', value: n.share_pct != null ? n.share_pct.toFixed(2) + '%' : '—' },
        { label: 'Avg Price', value: this.fmtAed(n.avg_price) },
      ];
      if (n.market_avg_price != null) stats.push({ label: 'Market Avg', value: this.fmtAed(n.market_avg_price) });
      if (n.price_vs_market_pct != null) stats.push({ label: 'vs Market', value: (n.price_vs_market_pct > 0 ? '+' : '') + n.price_vs_market_pct.toFixed(1) + '%' });
      return stats;
    },

    commDetailTypes() {
      const bt = this.commNode()?.by_type || {};
      const sorted = Object.entries(bt).sort((a, b) => b[1].total - a[1].total);
      const total = sorted.reduce((s, [, d]) => s + (d.total || 0), 0);
      return sorted.map(([name, d]) => ({
        name, count: d.total || 0, sale: d.sale || 0, rent: d.rent || 0,
        pct: total ? (d.total || 0) / total * 100 : 0,
      }));
    },

    commDetailBeds() {
      const beds = this.commNode()?.beds || {};
      const entries = Object.entries(beds).sort((a, b) => b[1] - a[1]);
      const max = Math.max(...entries.map(([, n]) => n), 1);
      return entries.map(([b, n]) => ({
        label: b === '0' || b === 'Studio' ? 'Studio' : b + ' BR',
        count: n, pct: n / max * 100,
      }));
    },

    commDetailBands() {
      const bands = this.commNode()?.price_bands || {};
      const entries = Object.entries(bands);
      const max = Math.max(...entries.map(([, n]) => n), 1);
      return entries.map(([b, n]) => ({ label: b, count: n, pct: n / max * 100 }));
    },

    commDetailSubs() {
      const subs = this.commNode()?.sub_communities || {};
      return Object.entries(subs)
        .map(([name, s]) => ({ name, count: s.count || 0, avg_price: s.avg_price }))
        .sort((a, b) => b.count - a.count);
    },

    commDetailAgents() {
      return (this.commNode()?.agents || []).slice(0, 20);
    },
  };
}
</script>
