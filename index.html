<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huspy Stock</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs@3/dist/cdn.min.js" defer></script>
  <script>
    tailwind.config = {
      theme: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        extend: { colors: {
          brand: '#1e40af', 'brand-light': '#eff6ff',
          up: '#059669', 'up-bg': '#ecfdf5',
          down: '#dc2626', 'down-bg': '#fef2f2',
          muted: '#6b7280',
        }}
      }
    }
  </script>
  <style>
    * { font-feature-settings: 'tnum' on, 'lnum' on; }
    body { background: #f8fafc; }
    [x-cloak] { display: none !important; }
    .bar { transition: width 0.4s ease; }
    .chip { @apply px-2.5 py-1 rounded-full text-xs font-medium cursor-pointer transition-all border; }
    .chip-on { @apply bg-brand text-white border-brand; }
    .chip-off { @apply bg-white text-gray-600 border-gray-200 hover:border-brand/40; }
  </style>
</head>
<body class="font-sans text-gray-900 min-h-screen" x-data="dashboard()" x-init="load()">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 class="text-lg font-bold text-brand">Huspy Stock</h1>
        <span x-show="data" x-text="data?.latestDate" class="text-sm text-muted bg-gray-100 px-2 py-0.5 rounded"></span>
      </div>
      <!-- Global search -->
      <div class="flex-1 max-w-md mx-4">
        <input type="text" x-model="search" placeholder="Search agent, community, type..."
          class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
      </div>
      <div class="flex items-center gap-1.5 text-sm">
        <button @click="view='summary'" :class="view==='summary' ? 'bg-brand text-white' : 'text-gray-600 hover:bg-gray-100'" class="px-3 py-1.5 rounded-md font-medium transition">Summary</button>
        <button @click="view='stock'" :class="view==='stock' ? 'bg-brand text-white' : 'text-gray-600 hover:bg-gray-100'" class="px-3 py-1.5 rounded-md font-medium transition">All Stock</button>
        <button @click="view='new'" :class="view==='new' ? 'bg-brand text-white' : 'text-gray-600 hover:bg-gray-100'" class="px-3 py-1.5 rounded-md font-medium transition">
          New 📝 <span x-text="data?.newCount || ''" class="ml-0.5 opacity-80"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Loading -->
  <div x-show="loading" class="flex items-center justify-center py-20">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand"></div>
  </div>

  <main x-show="data" x-cloak class="max-w-7xl mx-auto px-4 py-5">

    <!-- ===== FILTER BAR (always visible) ===== -->
    <div class="bg-white rounded-lg border border-gray-200 p-3 mb-4 flex flex-wrap items-center gap-3">
      <!-- Purpose -->
      <div class="flex gap-1.5">
        <button @click="fp=''; page=1" class="chip" :class="fp==='' ? 'chip-on' : 'chip-off'">All</button>
        <button @click="fp='sale'; page=1" class="px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer transition-all border-2" :class="fp==='sale' ? 'bg-emerald-500 text-white border-emerald-500 shadow-sm' : 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:border-emerald-400'">🏷 Sale</button>
        <button @click="fp='rent'; page=1" class="px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer transition-all border-2" :class="fp==='rent' ? 'bg-blue-500 text-white border-blue-500 shadow-sm' : 'bg-blue-50 text-blue-700 border-blue-200 hover:border-blue-400'">🔑 Rent</button>
      </div>
      <div class="w-px h-6 bg-gray-200"></div>
      <!-- Area (typeahead) -->
      <div class="relative" @click.away="areaOpen=false">
        <input type="text" :value="fa || areaQ" @input="areaQ=$event.target.value; fa=''; areaOpen=true; page=1" @focus="areaOpen=true"
          placeholder="All Areas" class="text-sm border border-gray-200 rounded-lg px-2.5 py-1.5 w-48 bg-white focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
        <button x-show="fa" @click.stop="fa=''; areaQ=''; page=1" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs">✕</button>
        <div x-show="areaOpen && areaOptions().length" class="absolute top-full left-0 mt-1 w-60 max-h-60 overflow-y-auto bg-white border border-gray-200 rounded-lg shadow-lg z-30">
          <template x-for="a in areaOptions()" :key="'ao-'+a">
            <div @click="fa=a; areaQ=''; areaOpen=false; page=1" class="px-3 py-1.5 text-sm hover:bg-brand-light cursor-pointer truncate" x-text="a"></div>
          </template>
        </div>
      </div>
      <!-- Agent (typeahead) -->
      <div class="relative" @click.away="agentOpen=false">
        <input type="text" :value="fag || agentQ" @input="agentQ=$event.target.value; fag=''; agentOpen=true; page=1" @focus="agentOpen=true"
          placeholder="All Agents" class="text-sm border border-gray-200 rounded-lg px-2.5 py-1.5 w-48 bg-white focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
        <button x-show="fag" @click.stop="fag=''; agentQ=''; page=1" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs">✕</button>
        <div x-show="agentOpen && agentOptions().length" class="absolute top-full left-0 mt-1 w-60 max-h-60 overflow-y-auto bg-white border border-gray-200 rounded-lg shadow-lg z-30">
          <template x-for="a in agentOptions()" :key="'go-'+a">
            <div @click="fag=a; agentQ=''; agentOpen=false; page=1" class="px-3 py-1.5 text-sm hover:bg-brand-light cursor-pointer truncate" x-text="a"></div>
          </template>
        </div>
      </div>
      <!-- Agent Level -->
      <select x-model="fl" class="text-sm border border-gray-200 rounded-lg px-2 py-1.5 bg-white">
        <option value="">All Levels</option>
        <template x-for="l in levels" :key="l"><option :value="l" x-text="l"></option></template>
      </select>
      <!-- Property Type -->
      <select x-model="ft" class="text-sm border border-gray-200 rounded-lg px-2 py-1.5 bg-white">
        <option value="">All Types</option>
        <template x-for="t in propTypes" :key="t"><option :value="t" x-text="t"></option></template>
      </select>
      <!-- Results count -->
      <span class="ml-auto text-sm text-muted" x-text="activeList().length + ' of ' + (view==='new' ? data?.newListings?.length : data?.allListings?.length) + ' listings'"></span>
      <button x-show="hasFilters()" @click="clearFilters()" class="flex items-center gap-1 text-xs text-brand hover:underline"><span>←</span> Clear all</button>
    </div>

    <!-- ===== SUMMARY VIEW ===== -->
    <div x-show="view==='summary'">
      <!-- KPI cards -->
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-5">
        <div class="bg-white rounded-lg border border-gray-200 p-4">
          <div class="text-xs text-muted mb-1">Total Stock</div>
          <div class="text-2xl font-bold" x-text="fmt(filteredAll().length)"></div>
          <div x-show="hasFilters()" class="text-[11px] text-muted mt-0.5" x-text="'of ' + fmt(data?.total)"></div>
        </div>
        <div class="rounded-lg border-2 p-4 cursor-pointer transition-all" :class="fp==='sale' ? 'bg-emerald-50 border-emerald-500 shadow-sm' : 'bg-white border-gray-200 hover:border-emerald-300'" @click="fp = fp==='sale' ? '' : 'sale'; page=1">
          <div class="text-xs mb-1" :class="fp==='sale' ? 'text-emerald-600' : 'text-muted'">🏷 For Sale</div>
          <div class="text-2xl font-bold" x-text="fmt(filteredAll().filter(l=>l.purpose==='sale').length)"></div>
        </div>
        <div class="rounded-lg border-2 p-4 cursor-pointer transition-all" :class="fp==='rent' ? 'bg-blue-50 border-blue-500 shadow-sm' : 'bg-white border-gray-200 hover:border-blue-300'" @click="fp = fp==='rent' ? '' : 'rent'; page=1">
          <div class="text-xs mb-1" :class="fp==='rent' ? 'text-blue-600' : 'text-muted'">🔑 For Rent</div>
          <div class="text-2xl font-bold" x-text="fmt(filteredAll().filter(l=>l.purpose==='rent').length)"></div>
        </div>
        <div class="bg-white rounded-lg border border-gray-200 p-4 border-l-4 border-l-green-500">
          <div class="text-xs text-muted mb-1">📝 New</div>
          <div class="text-2xl font-bold text-green-600" x-text="fmt(filteredAll().filter(l=>l.isNew).length)"></div>
        </div>
        <div class="bg-white rounded-lg border border-gray-200 p-4 border-l-4 border-l-red-400">
          <div class="text-xs text-muted mb-1">🗑 Removed</div>
          <div class="text-2xl font-bold text-red-500" x-text="fmt(data?.removedCount)"></div>
        </div>
      </div>

      <div class="grid md:grid-cols-3 gap-4">
        <!-- Top Areas -->
        <div class="bg-white rounded-lg border border-gray-200 p-4">
          <h2 class="font-semibold text-sm mb-3">Stock by Area</h2>
          <div class="space-y-1">
            <template x-for="[area, count] in topAreas()" :key="area">
              <div class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 rounded px-1.5 py-1 -mx-1.5" @click="fa=area; view='stock'">
                <div class="w-36 text-xs truncate" x-text="area"></div>
                <div class="flex-1 bg-gray-100 rounded-full h-4 overflow-hidden">
                  <div class="bg-brand/60 h-full rounded-full bar" :style="'width:' + (count / topAreas()[0]?.[1] * 100) + '%'"></div>
                </div>
                <div class="w-7 text-right text-xs font-medium" x-text="count"></div>
              </div>
            </template>
          </div>
        </div>

        <!-- Top Agents -->
        <div class="bg-white rounded-lg border border-gray-200 p-4">
          <h2 class="font-semibold text-sm mb-3">Top Agents</h2>
          <div class="space-y-1">
            <template x-for="[agent, count] in topAgents()" :key="agent">
              <div class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 rounded px-1.5 py-1 -mx-1.5" @click="fag=agent; view='stock'">
                <div class="w-36 text-xs truncate" x-text="agent"></div>
                <div class="flex-1 bg-gray-100 rounded-full h-4 overflow-hidden">
                  <div class="bg-purple-500/60 h-full rounded-full bar" :style="'width:' + (count / topAgents()[0]?.[1] * 100) + '%'"></div>
                </div>
                <div class="w-7 text-right text-xs font-medium" x-text="count"></div>
              </div>
            </template>
          </div>
        </div>

        <!-- Agent Levels -->
        <div class="bg-white rounded-lg border border-gray-200 p-4">
          <h2 class="font-semibold text-sm mb-3">By Agent Level</h2>
          <div class="space-y-1.5">
            <template x-for="[level, count] in levelBreakdown()" :key="level">
              <div class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 rounded px-1.5 py-1 -mx-1.5" @click="fl=level; view='stock'">
                <div class="w-24 text-xs flex items-center gap-1">
                  <span x-text="badge(level)"></span><span x-text="level"></span>
                </div>
                <div class="flex-1 bg-gray-100 rounded-full h-4 overflow-hidden">
                  <div class="h-full rounded-full bar" :class="levelColor(level)" :style="'width:' + (count / levelBreakdown()[0]?.[1] * 100) + '%'"></div>
                </div>
                <div class="w-7 text-right text-xs font-medium" x-text="count"></div>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Bedrooms + Price Bands row -->
      <div class="grid md:grid-cols-2 gap-4 mt-4">
        <!-- By Bedrooms -->
        <div class="bg-white rounded-lg border border-gray-200 p-4">
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-semibold text-sm" x-text="'By Bedrooms' + (fp ? ' (' + (fp==='rent'?'Rent':'Sale') + ')' : '')"></h2>
            <span class="text-[11px] text-muted" x-text="'% of ' + bedroomTotal() + ' ' + (fp||'all') + ' listings'"></span>
          </div>
          <div class="space-y-1.5">
            <template x-for="[beds, count, pct] in bedroomBreakdown()" :key="beds">
              <div class="flex items-center gap-2">
                <div class="w-16 text-xs text-muted" x-text="beds"></div>
                <div class="flex-1 bg-gray-100 rounded-full h-5 overflow-hidden">
                  <div class="h-full rounded-full bar" :class="fp==='rent' ? 'bg-blue-500/60' : fp==='sale' ? 'bg-emerald-500/60' : 'bg-brand/60'" :style="'width:' + pct + '%'"></div>
                </div>
                <div class="w-8 text-right text-xs font-medium" x-text="count"></div>
                <div class="w-12 text-right text-xs text-muted" x-text="pct.toFixed(1) + '%'"></div>
              </div>
            </template>
          </div>
        </div>

        <!-- By Price Band -->
        <div class="bg-white rounded-lg border border-gray-200 p-4">
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-semibold text-sm" x-text="'By Price' + (fp ? ' (' + (fp==='rent'?'Rent':'Sale') + ')' : '')"></h2>
            <span class="text-[11px] text-muted" x-text="'% of ' + priceBandTotal() + ' ' + (fp||'all') + ' listings'"></span>
          </div>
          <div class="space-y-1.5">
            <template x-for="[band, count, pct] in priceBandsWithPct()" :key="band">
              <div class="flex items-center gap-2">
                <div class="w-20 text-xs text-muted" x-text="band"></div>
                <div class="flex-1 bg-gray-100 rounded-full h-5 overflow-hidden">
                  <div class="h-full rounded-full bar" :class="fp==='rent' ? 'bg-blue-500/60' : fp==='sale' ? 'bg-emerald-500/60' : 'bg-brand/60'" :style="'width:' + pct + '%'"></div>
                </div>
                <div class="w-8 text-right text-xs font-medium" x-text="count"></div>
                <div class="w-12 text-right text-xs text-muted" x-text="pct.toFixed(1) + '%'"></div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== ALL STOCK / NEW LISTINGS TABLE ===== -->
    <div x-show="view==='stock' || view==='new'">
      <!-- Back to summary -->
      <button x-show="hasFilters()" @click="view='summary'" class="mb-3 flex items-center gap-1.5 text-sm text-brand hover:underline">
        <span class="text-base">←</span> Back to Summary
      </button>
      <div class="bg-white rounded-lg border border-gray-200 overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-left text-muted">
            <tr>
              <th class="px-3 py-2 font-medium cursor-pointer" @click="sortBy('community')">
                Community <span x-text="sortIcon('community')"></span>
              </th>
              <th class="px-3 py-2 font-medium cursor-pointer" @click="sortBy('type')">
                Type <span x-text="sortIcon('type')"></span>
              </th>
              <th class="px-3 py-2 font-medium cursor-pointer" @click="sortBy('bedrooms')">
                Beds <span x-text="sortIcon('bedrooms')"></span>
              </th>
              <th class="px-3 py-2 font-medium cursor-pointer" @click="sortBy('price')">
                Price <span x-text="sortIcon('price')"></span>
              </th>
              <th class="px-3 py-2 font-medium">Purpose</th>
              <th class="px-3 py-2 font-medium cursor-pointer" @click="sortBy('agent')">
                Agent <span x-text="sortIcon('agent')"></span>
              </th>
              <th class="px-3 py-2 font-medium">Level</th>
              <th x-show="view==='stock'" class="px-3 py-2 font-medium">Status</th>
              <th class="px-3 py-2 font-medium"></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-50">
            <template x-for="l in pagedList()" :key="l.id">
              <tr class="hover:bg-gray-50/80">
                <td class="px-3 py-2">
                  <div class="font-medium text-xs" x-text="l.community"></div>
                  <div class="text-[11px] text-muted" x-text="l.sub_community !== l.community ? l.sub_community : ''"></div>
                </td>
                <td class="px-3 py-2 text-xs" x-text="l.type"></td>
                <td class="px-3 py-2 text-xs" x-text="l.bedrooms === 0 ? 'Studio' : (l.bedrooms ?? '—')"></td>
                <td class="px-3 py-2 text-xs font-medium" x-text="l.priceFormatted"></td>
                <td class="px-3 py-2">
                  <span class="px-1.5 py-0.5 rounded text-[11px] font-medium"
                    :class="l.purpose==='sale' ? 'bg-emerald-50 text-emerald-700' : 'bg-blue-50 text-blue-700'"
                    x-text="l.purpose"></span>
                </td>
                <td class="px-3 py-2 text-xs text-muted max-w-[140px] truncate" x-text="l.agent || '—'"></td>
                <td class="px-3 py-2">
                  <span class="text-[11px]" x-text="badge(l.agentLevel) + ' ' + l.agentLevel"></span>
                </td>
                <td x-show="view==='stock'" class="px-3 py-2">
                  <span x-show="l.isNew" class="px-1.5 py-0.5 rounded text-[11px] font-medium bg-green-50 text-green-700">NEW</span>
                </td>
                <td class="px-3 py-2">
                  <a :href="'https://www.bayut.com' + l.url" target="_blank" class="text-brand hover:underline text-xs">View →</a>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        <div x-show="activeList().length > page * pageSize" class="p-3 text-center border-t border-gray-100">
          <button @click="page++" class="text-sm text-brand hover:underline" x-text="'Show more (' + (activeList().length - page * pageSize) + ' remaining)'"></button>
        </div>
        <div x-show="activeList().length === 0" class="p-8 text-center text-muted">No listings match your filters</div>
      </div>
    </div>

  </main>

  <script>
    function dashboard() {
      return {
        data: null, loading: true,
        view: 'summary', search: '',
        fp: '', fa: '', fag: '', fl: '', ft: '',
        areaQ: '', agentQ: '', areaOpen: false, agentOpen: false,
        sort: { key: '', dir: 'asc' },
        page: 1, pageSize: 100,

        levels: ['Signature', 'Hot', 'TruBroker', 'Verified', 'Standard'],

        get areas() {
          if (!this.data) return [];
          const c = new Set(this.data.allListings.map(l => l.community).filter(Boolean));
          return [...c].sort((a,b) => a.localeCompare(b));
        },
        get agents() {
          if (!this.data) return [];
          // Use full agent registry if available, fall back to listing agents
          if (this.data.agentRegistry?.length) {
            return this.data.agentRegistry.map(a => a.name).sort((a,b) => a.localeCompare(b));
          }
          const c = new Set(this.data.allListings.map(l => l.agent).filter(Boolean));
          return [...c].sort((a,b) => a.localeCompare(b));
        },
        areaOptions() {
          const s = (this.areaQ||'').toLowerCase();
          return this.areas.filter(a => !s || a.toLowerCase().includes(s));
        },
        agentOptions() {
          const s = (this.agentQ||'').toLowerCase();
          return this.agents.filter(a => !s || a.toLowerCase().includes(s));
        },
        get propTypes() {
          if (!this.data) return [];
          const c = {};
          for (const l of this.data.allListings) if (l.type) c[l.type] = (c[l.type]||0) + 1;
          return Object.entries(c).sort((a,b) => b[1]-a[1]).map(e => e[0]);
        },

        fmt(n) { return n?.toLocaleString() ?? '—'; },
        badge(level) { return {Signature:'⭐',Hot:'🔥',TruBroker:'✅',Verified:'☑️',Standard:'◽'}[level]||''; },
        levelColor(level) { return {Signature:'bg-amber-500/70',Hot:'bg-orange-500/70',TruBroker:'bg-green-500/70',Verified:'bg-blue-400/70',Standard:'bg-gray-400/70'}[level]||'bg-gray-400'; },

        hasFilters() { return this.fp || this.fa || this.fag || this.fl || this.ft || this.search; },
        clearFilters() { this.fp=''; this.fa=''; this.fag=''; this.fl=''; this.ft=''; this.search=''; this.page=1; },

        filteredAll() { return this.activeList(); },
        // Scoped to market type: when purpose filter is set, % is against that purpose only
        // When no purpose filter, splits into sale then rent sections
        _scopedList() {
          const list = this.filteredAll();
          // If purpose filter active, already scoped; if not, return all
          return list;
        },
        bedroomBreakdown() {
          const list = this._scopedList();
          const total = list.length;
          const c = {};
          for (const l of list) {
            const b = l.bedrooms === 0 ? 'Studio' : l.bedrooms != null ? l.bedrooms + ' Bed' : 'N/A';
            c[b] = (c[b]||0) + 1;
          }
          const order = ['Studio','1 Bed','2 Bed','3 Bed','4 Bed','5 Bed','6 Bed','7 Bed','8 Bed','N/A'];
          return order.filter(b => c[b]).map(b => [b, c[b], total ? c[b]/total*100 : 0]);
        },
        bedroomTotal() { return this._scopedList().length; },
        priceBandTotal() { return this._scopedList().length; },
        priceBandsWithPct() {
          const list = this._scopedList();
          const total = list.length;
          const c = {};
          for (const l of list) {
            if (l.priceBand) c[l.priceBand] = (c[l.priceBand]||0) + 1;
          }
          const saleOrder = ['Under 1M','1M\u20132M','2M\u20135M','5M\u201310M','10M+'];
          const rentOrder = ['Under 50K','50K\u2013100K','100K\u2013200K','200K\u2013350K','350K+'];
          const order = this.fp==='rent' ? rentOrder : this.fp==='sale' ? saleOrder : [...saleOrder, ...rentOrder];
          return order.filter(b => c[b]).map(b => [b, c[b], total ? c[b]/total*100 : 0]);
        },
        priceBands() { return this.priceBandsWithPct(); },
        topAreas() {
          const c = {};
          for (const l of this.filteredAll()) c[l.community] = (c[l.community]||0) + 1;
          return Object.entries(c).sort((a,b) => b[1]-a[1]).slice(0, 15);
        },
        topAgents() {
          const c = {};
          for (const l of this.filteredAll()) if (l.agent) c[l.agent] = (c[l.agent]||0) + 1;
          return Object.entries(c).sort((a,b) => b[1]-a[1]).slice(0, 15);
        },
        levelBreakdown() {
          const c = {};
          for (const l of this.filteredAll()) c[l.agentLevel] = (c[l.agentLevel]||0) + 1;
          return this.levels.filter(l => c[l]).map(l => [l, c[l]]);
        },
